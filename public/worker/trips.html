<!DOCTYPE html>
<html lang="en">

<head>
    <meta http-equiv="Content-Type" content="text/html; charset=UTF-8">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
    <meta name="description" content="Mega Trasporti - Viaggi">
    <meta name="keywords" content="Mega Trasporti, viaggi, consegne">
    <meta name="author" content="Mega">
    <link rel="manifest" href="manifest.json?v=7">
    <link rel="icon" href="images/logo/pwa-frontend-512.png" type="image/png">
    <title>Mega Trasporti - Viaggi</title>

    <link rel="apple-touch-icon" href="images/logo/pwa-frontend-512.png">
    <meta name="title-color" content="#1F1F1F">
    <meta name="mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black">
    <meta name="apple-mobile-web-app-title" content="Mega">
    <meta name="msapplication-TileImage" content="images/logo/pwa-frontend-512.png">
    <meta name="msapplication-TileColor" content="#1A2A9C">
    <link rel="preload" href="fonts/GTWalsheimPro-Regular.woff2" as="font" type="font/woff2" crossorigin>

    <!--Google font-->
    <link rel="stylesheet" type="text/css" href="css/GTWalsheimPro.css?v=7">

    <!-- iconsax css -->
    <link rel="stylesheet" type="text/css" href="css/vendors/iconsax.css?v=7">

    <!-- bootstrap css -->
    <link rel="stylesheet" id="rtl-link" type="text/css" href="css/vendors/bootstrap.css?v=7">

    <!-- Theme css -->
    <link rel="stylesheet" id="change-link" type="text/css" href="css/style.css?v=7">
</head>

<body data-require-auth="true">
    <div id="page-loader" class="page-loader d-none">
        <div class="spinner"></div>
    </div>
    <!-- header starts -->
    <header id="header" class="main-header">
        <div class="custom-container">
            <div class="header-panel justify-content-between align-items-center">
                <img class="img-fluid logo user-logo header-brand-logo" src="images/logo/logo-megatrasporti-white.png" alt="Mega Trasporti">
                <a href="#" id="logout-link" class="d-flex align-items-center gap-1" style="color: #fff; font-weight: 600;">
                    <img class="unactive" src="images/svg/logout.svg" alt="logout" style="width:20px;height:20px;">
                </a>
            </div>
        </div>
    </header>
    <!-- header end -->

    <!-- search + azioni -->
    <section class="home-profile-section section-b-space pt-0">
        <div class="custom-container">
            <div class="mb-2">
                <h6 class="title-color mb-0" id="user-greeting">Ciao</h6>
            </div>
            <div class="form-input">
                <input type="search" class="form-control with-icon" id="search-trips" placeholder="Cerca viaggio">
                <i class="iconsax search-icon" data-icon="search-normal-2"> </i>
            </div>
            <button class="btn theme-btn w-100 auth-btn mt-3 btn-lg" data-bs-toggle="modal" data-bs-target="#tripModal" style="
    background-color: white!important;
    color: #1A2A9C!important;
">
                Nuovo viaggio
            </button>
        </div>
    </section>

    <!-- lista viaggi -->
    <section>
        <div class="custom-container">
            <div class="title">
                <h3>Viaggi</h3>
                <p class="content-color mb-0">Le schede viaggio inviate.</p>
            </div>

            <div class="nav nav-pills gap-2 flex-nowrap overflow-auto mb-3" id="vehicle-tabs" role="tablist" style="white-space: nowrap;">
                <button class="btn btn-light btn-sm active" data-vehicle-id="" type="button">Tutti</button>
            </div>

            <div class="row gy-3" id="trips-list">
                <div class="col-12">
                    <p class="content-color mb-0">Nessun viaggio ancora.</p>
                </div>
            </div>
        </div>
    </section>

    <!-- panel-space start -->
    <section class="panel-space"></section>
    <!-- panel-space end -->

    <!-- bottom navbar start -->
    <div class="navbar-menu">
        <ul>
            <li>
                <a href="home.html" class="nav-link-loading">
                    <div class="icon">
                        <img class="unactive" src="images/svg/fuel-fill.svg" alt="rifornimento">
                        <img class="active" src="images/svg/fuel.svg" alt="rifornimento">
                    </div>
                    <span style="color: #1F1F1F;">Rifornimento</span>
                </a>
            </li>
            <li>
                <a href="maintenance.html" class="nav-link-loading">
                    <div class="icon">
                        <img class="unactive" src="images/svg/setting-fill.svg" alt="manutenzione">
                        <img class="active" src="images/svg/setting.svg" alt="manutenzione">
                    </div>
                    <span style="color: #1F1F1F;">Manutenzione</span>
                </a>
            </li>
            <li>
                <a href="documents.html" class="nav-link-loading">
                    <div class="icon">
                        <img class="unactive" src="images/svg/category-fill.svg" alt="documenti">
                        <img class="active" src="images/svg/category.svg" alt="documenti">
                    </div>
                    <span style="color: #1F1F1F;">Documenti</span>
                </a>
            </li>
            <li class="active">
                <a href="trips.html" class="nav-link-loading">
                    <div class="icon">
                        <img class="unactive" src="images/svg/truck-fill.svg" alt="viaggi">
                        <img class="active" src="images/svg/truck.svg" alt="viaggi">
                    </div>
                    <span class="active">Viaggi</span>
                </a>
            </li>
        </ul>
    </div>
    <!-- bottom navbar end -->

    <!-- modal viaggio -->
    <div class="modal fade" id="tripModal" tabindex="-1" aria-labelledby="tripModalLabel" aria-hidden="true">
        <div class="modal-dialog modal-dialog-centered modal-dialog-scrollable">
            <div class="modal-content">
                <div class="modal-header">
                    <h5 class="modal-title" id="tripModalLabel">Nuovo viaggio</h5>
                    <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button>
                </div>
                <div class="modal-body">
                    <div class="alert alert-danger d-none" role="alert" id="trip-alert"></div>
                    <form id="trip-form" novalidate>
                        <div class="row g-3">
                            <div class="col-12">
                                <label class="form-label mb-1">Data e ora</label>
                                <input type="datetime-local" class="form-control" name="date" required>
                            </div>
                            <div class="col-12">
                                <label class="form-label mb-1">Piattaforma</label>
                                <select class="form-select" name="platform_id" id="platform-select" required>
                                    <option value="">Seleziona</option>
                                </select>
                            </div>
                            <div class="col-12">
                                <label class="form-label mb-1">Targa</label>
                                <input type="search" class="form-control mb-2" id="trip-vehicle-search" placeholder="Cerca targa o nome veicolo" autocomplete="off">
                                <select class="form-select" name="vehicle_id" id="vehicle-select" required>
                                    <option value="">Seleziona</option>
                                </select>
                                <small class="text-muted d-block mt-1" id="trip-last-vehicle-hint">Cerca per targa o nome del veicolo.</small>
                            </div>
                            <div class="col-12">
                                <label class="form-label mb-1">Destinazioni</label>
                                <div id="destinations-list" class="d-flex flex-column gap-2"></div>
                                <button type="button" class="btn btn-outline-secondary btn-sm mt-2" id="add-destination">+ Aggiungi destinazione</button>
                            </div>
                            <div class="col-12">
                                <label class="form-label mb-1 d-block">Dicitura</label>
                                <div class="d-flex gap-4">
                                    <div class="form-check">
                                        <input class="form-check-input" type="radio" name="goods_type" id="goods-secco" value="secco">
                                        <label class="form-check-label" for="goods-secco">Secco</label>
                                    </div>
                                    <div class="form-check">
                                        <input class="form-check-input" type="radio" name="goods_type" id="goods-freschi" value="freschi">
                                        <label class="form-check-label" for="goods-freschi">Freschi</label>
                                    </div>
                                </div>
                            </div>
                            <div class="col-12">
                                <label class="form-label mb-1">Bolla</label>
                                <input type="text" class="form-control" name="delivery_note_number" inputmode="numeric" pattern="[0-9]*" autocomplete="off" required>
                            </div>
                            <div class="col-12">
                                <label class="form-label mb-1">Allegato</label>
                                <input type="file" class="form-control" name="attachment" accept="image/*,application/pdf" required>
                            </div>
                        </div>
                    </form>
                </div>
                <div class="modal-footer">
                    <button type="button" class="btn btn-outline-secondary" data-bs-dismiss="modal">Chiudi</button>
                    <button type="button" class="btn theme-btn" id="trip-submit">Salva</button>
                </div>
            </div>
        </div>
    </div>

    <!-- iconsax js -->
    <script src="js/iconsax.js?v=7"></script>

    <!-- bootstrap js -->
    <script src="js/bootstrap.bundle.min.js?v=7"></script>

    <!-- sticky-header js -->
    <script src="js/sticky-header.js?v=7"></script>

    <!-- template-setting js -->
    <script src="js/template-setting.js?v=7"></script>

    <!-- script js -->
    <script src="js/script.js?v=7"></script>
    <script src="js/auth.js?v=7"></script>
    <script src="js/trips.js?v=7"></script>
    <script>
        (function () {
            const loader = document.getElementById('page-loader');
            const showLoader = () => loader?.classList.remove('d-none');

            document.querySelectorAll('.nav-link-loading').forEach((link) => {
                link.addEventListener('click', () => showLoader());
            });

            const logout = document.getElementById('logout-link');
            if (logout) {
                logout.addEventListener('click', () => showLoader());
            }
        })();
    </script>
</body>

</html>
